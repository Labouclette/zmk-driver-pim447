description: Pimoroni Trackball (PIM447) I2C sensor

compatible: "pimoroni,trackball_pim447"

include: i2c-device.yaml

properties:
  sensitivity:
    type: int
    default: 64
    minimum: 1
    maximum: 255

  move-factor:
    type: int
    default: 1
    minimum: 1
    maximum: 100

  scroll-factor:
    type: int
    default: 1
    minimum: 1
    maximum: 10

  led-red:
    type: int
    default: 0
    minimum: 0
    maximum: 255

  led-green:
    type: int
    default: 0
    minimum: 0
    maximum: 255

  led-blue:
    type: int
    default: 0
    minimum: 0
    maximum: 255

  invert-x:
    type: boolean

  invert-y:
    type: boolean
